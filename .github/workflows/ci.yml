name: CI

on:
  # Обе ветки перечислены намеренно: репозиторий живёт на master, но при
  # переименовании в main CI не должен молча перестать запускаться.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Сборка и тесты
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CockRealSizeBot.slnx

      - name: Build
        run: dotnet build CockRealSizeBot.slnx --configuration Release --no-restore

      - name: Format
        run: dotnet format CockRealSizeBot.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --solution CockRealSizeBot.slnx --configuration Release --no-build

  publish:
    name: Публикация образа
    needs: test
    # Пул-реквесты образ не публикуют — только пуш в основную ветку.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги и метки
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Сборка и push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
